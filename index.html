<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edy Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#F3F2EE;--surface:#FFFFFF;--field:#FAFAF8;--fg:#17181A;--muted:#62646A;--line:#DDDBD4;--accent:#D9481A;--accent-ink:#FFFFFF;--ok:#1F7A4D;--bad:#B3261E;--f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}

:root[data-theme="dark"]{--bg:#121315;--surface:#1B1C1F;--field:#151618;--fg:#ECEBE6;--muted:#9A9BA2;--line:#2C2E33;--accent:#FF7440;--accent-ink:#1A0D07;--ok:#59C48A;--bad:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1040px;margin:0 auto}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 6px}
.brand{font:800 22px/1 var(--f-display);letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.tag{color:var(--muted);font-size:13px}
.layout{display:grid;gap:0 36px;grid-template-columns:minmax(0,1fr)}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.frame{height:min(42vh,520px);min-height:240px;aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden;background:#111;box-shadow:0 0 0 1px var(--line),0 10px 30px -14px rgba(0,0,0,.35)}
.frame canvas{display:block;width:100%;height:100%}
.transport{display:flex;align-items:center;gap:12px;width:100%;max-width:420px}
.play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:16px;cursor:pointer;display:grid;place-items:center}
.play:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.transport input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:32px}
.time{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface);box-shadow:0 0 0 1px var(--line);margin:8px 0 14px}
.tabs button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:500 13.5px var(--f-body);cursor:pointer;padding:0 4px}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg)}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.hint code{font:500 12px var(--f-mono);background:var(--surface);padding:1px 5px;border-radius:5px;box-shadow:0 0 0 1px var(--line)}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:14px;padding:12px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.card.is-active{box-shadow:0 0 0 2px var(--accent)}
.card header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seek{border:0;background:none;padding:6px 0;font:700 14px var(--f-body);color:var(--fg);cursor:pointer;text-align:left}
.seek span{font:500 12px var(--f-mono);color:var(--muted);margin-left:8px}
.acts{display:flex;gap:2px}
.acts button{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:16px;cursor:pointer}
.acts button:hover{background:var(--field);color:var(--fg)}
.acts button:disabled{opacity:.3;cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg)}
label.chk input{width:18px;height:18px;accent-color:var(--accent)}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;font:400 15px var(--f-body);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
textarea{resize:vertical;line-height:1.35}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--f-body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.add{width:100%;margin-top:12px;border-style:dashed}
.sec{background:var(--surface);border-radius:14px;padding:14px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.sec h3{margin:0;font:800 15px var(--f-display);letter-spacing:-.01em}
.sec summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
.sec details{display:flex;flex-direction:column;gap:12px}
.sec details>summary{margin-bottom:12px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{border:2px solid var(--line);background:var(--field);border-radius:12px;padding:8px;cursor:pointer;color:var(--fg);font:500 13px var(--f-body);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip[aria-pressed=true]{border-color:var(--accent)}
.sw{width:100%;height:34px;border-radius:7px;display:flex;align-items:flex-end;padding:5px 6px;font:800 12px var(--f-display)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.meta dt{color:var(--muted)}.meta dd{margin:0;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:0}
.note.bad{color:var(--bad)}.note.ok{color:var(--ok)}
.note a{color:var(--accent)}
.imgrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.thumb{width:64px;aspect-ratio:9/16;border-radius:9px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imgctl{display:flex;flex-direction:column;gap:8px;min-width:0}
.imgctl .rowx{display:flex;gap:8px;flex-wrap:wrap}.imgctl .rowx .btn{flex:1 1 90px;min-height:38px;padding:0 10px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn input[type=file]{display:none}
#sline{margin:0;max-width:420px;text-align:center;font-size:12px}
.result{display:flex;flex-direction:column;align-items:center;gap:10px}
.result video{height:min(46vh,480px);max-width:100%;aspect-ratio:9/16;border-radius:12px;background:#000}
.card details{display:flex;flex-direction:column;gap:10px}
.card details>summary{cursor:pointer;font-size:13.5px;color:var(--muted);padding:4px 0}
textarea.code{font:500 12.5px/1.4 var(--f-mono);white-space:pre;overflow:auto;tab-size:2}
@media (min-width:880px){.layout{grid-template-columns:360px minmax(0,1fr);align-items:start}.stage{top:16px;padding-top:12px}.frame{height:min(72vh,640px)}body::before{display:none}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div class="brand">Edy <i>Motion</i></div>
<div class="tag">Naskah → video 9:16</div>
</header>
<div class="layout">
<section class="stage" aria-label="Pratinjau video">
<div class="frame"><canvas id="cv" width="720" height="1280"></canvas></div>
<div class="transport">
<button class="play" id="play" aria-label="Putar">▶</button>
<input type="range" id="scrub" min="0" max="10" step="0.01" value="0" aria-label="Posisi video">
<span class="time" id="time">0:00.0 / 0:00.0</span>
</div>
<p class="note" id="sline" hidden></p>
</section>
<main>
<nav class="tabs" role="tablist">
<button role="tab" data-tab="script" aria-selected="true">Naskah</button>
<button role="tab" data-tab="scenes" aria-selected="false">Adegan</button>
<button role="tab" data-tab="style" aria-selected="false">Gaya</button>
<button role="tab" data-tab="export" aria-selected="false">Ekspor</button>
</nav>
<div id="panel"></div>
</main>
</div>

  var h='<div class="sec"><h3>Ringkasan</h3><dl class="meta"><dt>Durasi</dt><dd>'+fmt(T)+'</dd><dt>Ukuran</dt><dd>'+S.res+' × '+Math.round(S.res*16/9)+'</dd><dt>Suara</dt><dd>'+(audio.buf?esc(audio.name):"tanpa suara")+'</dd></dl>'+
   '<button class="btn primary" id="rec"'+(recording?" disabled":"")+'>'+(recording?"Merekam…":"Rekam video")+'</button>'+

function renderPanel(){panel.innerHTML=tab==="script"?scriptHTML():tab==="scenes"?scenesHTML():tab==="style"?styleHTML():exportHTML();document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===tab)});sync()}
document.querySelector(".tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;renderPanel()});
function sceneOf(el){var c=el.closest(".card");if(!c)return null;for(var i=0;i<S.scenes.length;i++)if(S.scenes[i].id===c.dataset.id)return i;return null}
panel.addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset.f){var i=sceneOf(el);if(i===null)return;var f=el.dataset.f,v=el.value;if(f==="dur"){v=clamp(parseFloat(v)||1,1,40);var lab=el.closest(".card").querySelector(".seek span");if(lab)lab.textContent=v.toFixed(1)+" dtk"}S.scenes[i][f]=v;if(f==="anim"||f==="dur"){playT=locate(playT).start+0.01}save();render();return}
  var id=el.id;

  else if(id==="ormodelx"){S.gem.openrouterModel=el.value.trim();save()}
  else if(id==="gstyle"){S.gem.style=el.value;save()}

panel.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset.f==="dur"){var i=sceneOf(el);if(i!==null)el.value=S.scenes[i].dur}
  if(el.id==="res"){S.res=+el.value;setRes();save();render()}

  if(el.id==="gvoice"){S.gem.voice=el.value;save()}

  if(el.id==="gprovtext"){S.gem.provText=el.value;save();renderPanel()}
  if(el.id==="gprovcode"){S.gem.provCode=el.value;save();renderPanel()}
  if(el.id==="grmodel"){if(el.value==="custom"){S.gem.groqCustom=true}else{S.gem.groqCustom=false;S.gem.groq=el.value}save();renderPanel()}
  if(el.id==="ormodel"){if(el.value==="custom"){S.gem.openrouterModelCustom=true}else{S.gem.openrouterModelCustom=false;S.gem.openrouterModel=el.value}save();renderPanel()}

  if(el.id==="glang"){S.gem.lang=el.value;save()}

  if(el.dataset.up&&el.files&&el.files[0]){var ui=sceneOf(el);if(ui!==null)importImage(el.files[0],ui).then(function(){renderPanel();render()});el.value=""}
  if(el.id==="bulkimg"&&el.files&&el.files.length){bulkImport(Array.prototype.slice.call(el.files));el.value=""}
  if(el.id==="gmode"){S.gem.imgMode=el.value;S.scenes.forEach(function(sc){if(imgs[sc.id])sc.imgMode=el.value});cache={};save();render()}
  if(el.id==="gremember"){rememberKey=el.checked;try{if(rememberKey){localStorage.setItem("pono-gkey",apiKey);localStorage.setItem("pono-groqkey",groqKey);localStorage.setItem("pono-openrouter-key",openrouterKey)}else{localStorage.removeItem("pono-gkey");localStorage.removeItem("pono-groqkey");localStorage.removeItem("pono-openrouter-key")}}catch(e){}}
});
panel.addEventListener("click",function(e){
  var tp=e.target.closest("[data-theme-pick]");
  if(tp){S.theme=tp.dataset.themePick;save();renderPanel();render();return}
  var b=e.target.closest("[data-act],#rec,#savebtn,#split,#tts,#codes,#codesall,#grlist");if(!b)return;
  if(b.id==="grlist"){if(!groqKey){setMsg("Isi API key Groq dulu.","bad");return}setMsg("Mengambil daftar model Groq…");groqModels().then(function(ids){if(!ids.length){setMsg("Tidak ada model teks.","bad");return}if(ids.indexOf(S.gem.groq)<0){S.gem.groq=pickGroq(ids);S.gem.groqCustom=false;save()}renderPanel();setMsg(ids.length+" model tersedia.","ok")}).catch(function(err){setMsg("Gagal: "+(err&&err.message||err),"bad")});return}
  if(b.id==="codes"){genCodes(true);return}
  if(b.id==="codesall"){genCodes(false);return}
  if(b.id==="rec"){doExport();return}
  if(b.id==="savebtn"){saveResult();return}
  if(b.id==="split"){doSplit();return}
  if(b.id==="tts"){makeVoice();return}
  var act=b.dataset.act,i=sceneOf(b);
  if(act==="seek"){var loc=0;for(var q=0;q<i;q++)loc+=+S.scenes[q].dur;pause();playT=loc+(+S.scenes[i].dur)*0.85;if(audio.el)try{audio.el.currentTime=Math.min(playT,audio.dur)}catch(e2){};render()}
  else if(act==="up"&&i>0){var t=S.scenes[i];S.scenes[i]=S.scenes[i-1];S.scenes[i-1]=t;afterStructure()}
  else if(act==="down"&&i<S.scenes.length-1){var t2=S.scenes[i];S.scenes[i]=S.scenes[i+1];S.scenes[i+1]=t2;afterStructure()}
  else if(act==="dup"){var c=JSON.parse(JSON.stringify(S.scenes[i]));var oldId=c.id;c.id=uid();S.scenes.splice(i+1,0,c);if(imgs[oldId]){var u=imgs[oldId].url,fr0=imgs[oldId].frames,fps0=imgs[oldId].fps;setImg(c.id,u).then(function(){idbDo("readwrite",function(s){return s.put(u,c.id)});if(fr0)setAnimFrames(c.id,fr0,fps0);renderPanel();render()})}afterStructure()}
  else if(act==="del"&&S.scenes.length>1){dropImg(S.scenes[i].id);S.scenes.splice(i,1);afterStructure()}
  else if(act==="genimg"){genImages(false,i)}
  else if(act==="codeimg"){codeToImage(i)}
  else if(act==="delimg"){dropImg(S.scenes[i].id);save();renderPanel();render()}
  else if(act==="add"){S.scenes.push({id:uid(),label:"",text:"Judul *baru*",bullets:"",dur:3.5,anim:"reveal",speech:""});afterStructure(true)}
  else if(act==="fit"&&audio.buf){var T=total(),f=audio.dur/T;S.scenes.forEach(function(s){s.dur=Math.max(1,Math.round((+s.dur)*f*10)/10)});save();renderPanel();render()}
  else if(act==="noaudio"){clearAudio();renderPanel()}
});
function afterStructure(scrollEnd){save();pause();playT=Math.min(playT,total());renderPanel();render();if(scrollEnd){var cs=panel.querySelectorAll(".card");var last=cs[cs.length-1];if(last)last.scrollIntoView({block:"center"})}}

function clearAudio(){if(audio.url)URL.revokeObjectURL(audio.url);audio={buf:null,url:null,el:null,name:"",dur:0,tts:false,sig:""}}
async function loadAudio(file){try{var ab=await file.arrayBuffer();var AC=window.AudioContext||window.webkitAudioContext,ac=new AC();var buf=await ac.decodeAudioData(ab.slice(0));try{ac.close()}catch(e){}clearAudio();var url=URL.createObjectURL(file),el=new Audio(url);el.preload="auto";audio={buf:buf,url:url,el:el,name:file.name,dur:buf.duration,tts:false,sig:""}}catch(err){clearAudio()}}

function pickMime(){if(!window.MediaRecorder)return null;var c=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];for(var i=0;i<c.length;i++)if(MediaRecorder.isTypeSupported(c[i]))return c[i];return ""}
function fixMp4Duration(buf,sec){var v=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);var movieTs=1000,found=0;function setDur(body,ver,ts,durOff32,durOff64){var val=Math.round(sec*ts);if(ver===1){v.setBigUint64(body+durOff64,BigInt(val))}else{v.setUint32(body+durOff32,val>>>0)}found++}function walk(start,end){var p=start;while(p+8<=end){var size=v.getUint32(p),type=String.fromCharCode(buf[p+4],buf[p+5],buf[p+6],buf[p+7]),hdr=8;if(size===1){size=Number(v.getBigUint64(p+8));hdr=16}else if(size===0){size=end-p}if(size<8||p+size>end)break;var body=p+hdr,ver=buf[body];if(type==='moov'||type==='trak'||type==='mdia'){walk(body,p+size)}else if(type==='mvhd'){if(ver===1){movieTs=v.getUint32(body+20);setDur(body,1,movieTs,0,24)}else{movieTs=v.getUint32(body+12);setDur(body,0,movieTs,16,0)}}else if(type==='mdhd'){var ts=ver===1?v.getUint32(body+20):v.getUint32(body+12);if(ver===1)setDur(body,1,ts,0,24);else setDur(body,0,ts,16,0)}else if(type==='tkhd'){if(ver===1)setDur(body,1,movieTs,0,28);else setDur(body,0,movieTs,20,0)}p+=size}}walk(0,buf.byteLength);return found}
async function doExport(){
  if(recording||busy)return;
  var msg=function(t,cls){var m=document.getElementById("msg");if(m){m.textContent=t;m.className="note "+(cls||"")}};
  var mime=pickMime();
  if(mime===null||!cv.captureStream){msg("Browser belum bisa merekam video.","bad");return}
  pause();recording=true;
  if(resultState){URL.revokeObjectURL(resultState.url);resultState=null}
  renderPanel();
  var wl=null;try{wl=await navigator.wakeLock.request("screen")}catch(e){}
  var T=total(),stream=cv.captureStream(30),ac=null,src=null;
  try{
    if(audio.buf){var AC=window.AudioContext||window.webkitAudioContext;ac=new AC();var dest=ac.createMediaStreamDestination();src=ac.createBufferSource();src.buffer=audio.buf;src.connect(dest);dest.stream.getAudioTracks().forEach(function(t){stream.addTrack(t)})}
    var rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:S.res>=1080?12e6:7e6}:undefined);
    var chunks=[];rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    var done=new Promise(function(res){rec.onstop=res});
    draw(0);await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});warm(0);
    var decs=[];S.scenes.forEach(function(sc){var im=imgs[sc.id];if(im&&im.fr)im.fr.forEach(function(a){decs.push(a.decode?a.decode().catch(function(){}):Promise.resolve())})});await Promise.all(decs);
    rec.start(250);if(src)src.start();
    var t0=performance.now(),bar=document.querySelector("#bar>i");
    await new Promise(function(res){(function loop(){var t=(performance.now()-t0)/1000;draw(Math.min(t,T-0.001));if(bar)bar.style.width=Math.min(100,t/T*100)+"%";if(t>=T+0.25){res();return}requestAnimationFrame(loop)})()});
    rec.stop();await done;try{if(src)src.stop()}catch(e){}
    var type=(rec.mimeType||mime||"video/webm").split(";")[0];
    var blob=new Blob(chunks,{type:type});
    if(type.indexOf("mp4")>-1){try{var mb=new Uint8Array(await blob.arrayBuffer());fixMp4Duration(mb,T);blob=new Blob([mb],{type:type})}catch(e){}}
    resultState={blob:blob,url:URL.createObjectURL(blob),ext:type.indexOf("mp4")>-1?"mp4":"webm"};
    recording=false;if(ac)try{ac.close()}catch(e){}if(wl)try{wl.release()}catch(e){}
    playT=0;renderPanel();render();
    var r=document.getElementById("resv");if(r)r.scrollIntoView({block:"center"});
  }catch(err){recording=false;if(ac)try{ac.close()}catch(e){}if(wl)try{wl.release()}catch(e){}renderPanel();msg("Perekaman gagal: "+(err&&err.message||err),"bad")}
}
async function saveResult(){
  var m=document.getElementById("savemsg");if(!resultState)return;
  if(!downloads){try{var a=document.createElement("a");a.href=resultState.url;a.download="edy-motion."+resultState.ext;document.body.appendChild(a);a.click();a.remove();if(m){m.textContent="Unduhan dimulai.";m.className="note ok"}}catch(e){}return}
  try{await downloads.save({filename:"edy-motion."+resultState.ext,data:resultState.blob});if(m){m.textContent="Video disimpan.";m.className="note ok"}}catch(e){if(m){m.textContent="Gagal menyimpan.","bad"}}
}
try{if(window.claude&&window.claude.use)window.claude.use("downloads").then(function(d){downloads=d}).catch(function(){})}catch(e){}

setRes();renderPanel();render();
idbOpen().then(function(db){idb=db;if(!db)return;return Promise.all(S.scenes.map(function(s){return idbDo("readonly",function(st){return st.get(s.id)}).then(function(u){return u?setImg(s.id,u).then(function(){return idbDo("readonly",function(st){return st.get("A:"+s.id)}).then(function(a){if(a&&a.frames&&imgs[s.id]){imgs[s.id].frames=a.frames;imgs[s.id].fps=a.fps||8}})}):false})})).then(function(){renderPanel();render()})});
if(document.fonts&&document.fonts.load){Promise.all(['800 80px "Bricolage Grotesque"','500 34px "DM Sans"'].map(function(f){return document.fonts.load(f)})).then(function(){cache={};render()}).catch(function(){});document.fonts.ready.then(function(){cache={};render()})}
})();
